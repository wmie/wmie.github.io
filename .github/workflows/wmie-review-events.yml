name: Pull request events
'on':
  push:
    branches-ignore:
    - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - edited
  pull_request_review:
    types:
    - submitted
    - edited
    - dismissed
permissions: {}
jobs:
  signal:
    runs-on: ubicloud-standard-2
    permissions: {}
    steps:
    - name: Signal a review change
      run: 'true'
env:
  WMIE_UBICLOUD_BOOTSTRAP_SHA: ${{ vars.WMIE_UBICLOUD_BOOTSTRAP_SHA }}
