name: WMIE CI
run-name: WMIE CI pr=${{ inputs.pr_number }} base=${{ inputs.base_sha }} head=${{ inputs.head_sha }}
'on':
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions: {}
concurrency:
  group: wmie-ci-pr-${{ inputs.pr_number }}
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    name: WMIE plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_components: ${{ steps.plan.outputs.has_components }}
      merge_sha: ${{ steps.context.outputs.merge_sha }}
      binding_id: ${{ steps.binding.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.workflow_sha }}
        path: wmie-control
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Install the configuration parser
      run: 'python3 -m pip install --only-binary=:all: --disable-pip-version-check -r wmie-control/.github/wmie/requirements.txt'
    - name: Bind the current PR and merge
      id: context
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 wmie-control/.github/wmie/control.py ci-context
    - name: Read the proposed source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ steps.context.outputs.merge_sha }}
        path: wmie-source
        persist-credentials: false
    - name: Derive applicable checks
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 wmie-control/.github/wmie/control.py ci-plan --source wmie-source
    - name: Preserve the CI plan
      id: binding
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: wmie-ci-binding-${{ github.run_id }}-${{ github.run_attempt }}
        path: wmie-ci-binding.json
        if-no-files-found: error
        retention-days: 30
  project:
    name: WMIE / ${{ matrix.component.id }}
    needs:
    - plan
    if: needs.plan.outputs.has_components == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.workflow_sha }}
        path: wmie-control
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Install the configuration parser
      run: 'python3 -m pip install --only-binary=:all: --disable-pip-version-check -r wmie-control/.github/wmie/requirements.txt'
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ needs.plan.outputs.merge_sha }}
        path: wmie-source
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      if: matrix.component.ecosystem == 'node'
      with:
        node-version: ${{ matrix.component.runtime }}
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      if: matrix.component.package_manager == 'pnpm'
      with:
        version: ${{ matrix.component.package_manager_version || '10.33.0' }}
        run_install: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      if: matrix.component.package_manager == 'bun'
      with:
        bun-version: ${{ matrix.component.package_manager_version || '1.4.4' }}
    - name: Prepare Yarn
      if: matrix.component.package_manager == 'yarn'
      env:
        WMIE_COMPONENT: ${{ toJSON(matrix.component) }}
      run: python3 wmie-control/.github/wmie/baseline.py yarn
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      if: matrix.component.ecosystem == 'python'
      with:
        python-version: ${{ matrix.component.runtime || '3.12' }}
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      if: matrix.component.package_manager == 'uv'
      with:
        version: 0.13.5
        enable-cache: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      if: matrix.component.ecosystem == 'go'
      with:
        go-version-file: wmie-source/${{ matrix.component.path }}/go.mod
        cache: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      if: matrix.component.ecosystem == 'rust'
      with:
        toolchain: ${{ matrix.component.runtime || 'stable' }}
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
      if: matrix.component.ecosystem == 'php'
      with:
        php-version: ${{ matrix.component.runtime || '8.3' }}
        extensions: ${{ join(matrix.component.php_extensions, ',') }}
        tools: composer
        coverage: none
    - name: Execute project checks
      env:
        WMIE_COMPONENT: ${{ toJSON(matrix.component) }}
        CI: 'true'
      run: python3 wmie-control/.github/wmie/control.py ci-component --source wmie-source
  content:
    name: WMIE content
    needs:
    - plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.workflow_sha }}
        path: wmie-control
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Install the configuration parser
      run: 'python3 -m pip install --only-binary=:all: --disable-pip-version-check -r wmie-control/.github/wmie/requirements.txt'
    - name: Read the proposed source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ needs.plan.outputs.merge_sha }}
        path: wmie-source
        persist-credentials: false
        fetch-depth: 0
    - name: Load the trusted CI plan
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        artifact-ids: ${{ needs.plan.outputs.binding_id }}
    - name: Inspect content
      run: python3 wmie-control/.github/wmie/baseline.py content --source wmie-source --binding wmie-ci-binding.json
  security:
    name: WMIE security
    needs:
    - plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.workflow_sha }}
        path: wmie-control
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Install the configuration parser
      run: 'python3 -m pip install --only-binary=:all: --disable-pip-version-check -r wmie-control/.github/wmie/requirements.txt'
    - name: Read the proposed source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ needs.plan.outputs.merge_sha }}
        path: wmie-source
        persist-credentials: false
        fetch-depth: 0
    - name: Load the trusted CI plan
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        artifact-ids: ${{ needs.plan.outputs.binding_id }}
    - name: Inspect security
      run: python3 wmie-control/.github/wmie/baseline.py security --source wmie-source --binding wmie-ci-binding.json
  aggregate:
    name: WMIE CI
    needs:
    - plan
    - project
    - content
    - security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.workflow_sha }}
        path: wmie-control
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Install the configuration parser
      run: 'python3 -m pip install --only-binary=:all: --disable-pip-version-check -r wmie-control/.github/wmie/requirements.txt'
    - name: Load the trusted CI plan
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        artifact-ids: ${{ needs.plan.outputs.binding_id }}
    - name: Require actual CI success
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 wmie-control/.github/wmie/control.py ci-aggregate --binding wmie-ci-binding.json
  reconcile:
    name: WMIE reconciliation
    needs:
    - aggregate
    if: always() && endsWith(github.workflow_ref, format('@refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
    - name: Request final governance assessment
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        WMIE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        WMIE_PR_NUMBER: ${{ inputs.pr_number }}
        WMIE_SOURCE_RUN: ${{ github.run_id }}
      run: gh workflow run wmie-governance.yml --ref "$WMIE_DEFAULT_BRANCH" -f pr_number="$WMIE_PR_NUMBER" -f source_run_id="$WMIE_SOURCE_RUN"
